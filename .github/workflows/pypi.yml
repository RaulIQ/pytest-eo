name: pypi
on:
  push:
    tags: ["*.*.*"]
jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: grep -q "^version = \"${GITHUB_REF_NAME}\"$" pyproject.toml || { echo "Tag ${GITHUB_REF_NAME} is not the version in pyproject.toml"; exit 1; }
      - run: python3 -m pip install build==1.3.0
      - run: python3 -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
