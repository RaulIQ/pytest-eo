[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pytest-eo"
version = "0.5.1"
description = "pytest --eo: strict style gate over ruff, mypy --strict and pyeo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "RaulIQ" }]
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "flake8==7.4.1",
    "eo-styleguide==0.2.0",
    "flake8-override==0.1.1",
    "typing_extensions>=4.4",
    "PyHamcrest>=2.1",
]

[project.optional-dependencies]
dev = ["coverage>=7.10"]

[project.entry-points.pytest11]
eo = "pytest_eo.plugin"

[project.entry-points."flake8.extension"]
TST = "pytest_eo.angry_tests:AngryTests"
ENC = "pytest_eo.encapsulation:Encapsulation"
BOD = "pytest_eo.bodies:Bodies"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_eo"]

[tool.eo]
paths = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pytest_eo"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
