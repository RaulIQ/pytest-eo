[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-eo"
version = "0.1.0"
description = "pytest --eo: strict style gate over ruff, mypy --strict and pyeo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "flake8==7.4.1",
    "eo-styleguide @ git+https://github.com/RaulIQ/pyeo@a19814d1bc2ed738cc0e2c299355896b39e8468f",
]

[project.entry-points.pytest11]
eo = "pytest_eo.plugin"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_eo"]

[tool.eo]
paths = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
