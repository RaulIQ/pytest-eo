[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-eo"
version = "0.1.0"
description = "pytest --eo: strict style gate over ruff, mypy --strict and pyeo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "flake8==7.4.1",
    "eo-styleguide @ git+https://github.com/RaulIQ/pyeo@b78fe981b8311dfb3a1b622a88c2dd8e5a15b8d1",
    "flake8-override @ git+https://github.com/RaulIQ/flake8-override@ecea1e0ee5cf9d5c3ac646e3dc3073448fd4b366",
    "typing_extensions>=4.4",
    "PyHamcrest>=2.1",
]

[project.optional-dependencies]
dev = ["coverage>=7.10"]

[project.entry-points.pytest11]
eo = "pytest_eo.plugin"

[project.entry-points."flake8.extension"]
TST = "pytest_eo.angry_tests:AngryTests"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_eo"]

[tool.eo]
paths = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pytest_eo"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
