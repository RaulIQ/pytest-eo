# Locked configuration: Elegant Objects rules from pyeo (eo-styleguide).
# FIN100  class must be final
# PEO101  __init__ contains only assignments
# PEO102  @classmethod contains only a cls() call
# PEO200  class must be frozen
# PEO300  no class names ending in "er"
# PEO301  no public attributes
# PEO400  no static methods
# PEO500  no @property, a getter in disguise
# PEO601  no methods starting with "get"
# PEO602  no getter methods
# PEO700  no type introspection, casting, or reflection
# OVR100  every public method is an @override of an interface method
# FOC100  one public class per module (flake8-one-class)
# NPM100  no private functions or methods (flake8-no-private-methods)
# ENC100  a class encapsulates one to four attributes (pytest-eo itself)
# BOD100  a function body holds no blank lines (pytest-eo itself)
# BOD200  a function body holds no comments, except suppressions (pytest-eo itself)
# TST100  a test ends with its only assertion (pytest-eo itself)
# TST200  a test module shares no constants between its tests (pytest-eo itself)
# TST300  every assertion carries a negative message (pytest-eo itself)
[flake8]
select = FIN100,PEO101,PEO102,PEO200,PEO300,PEO301,PEO400,PEO500,PEO601,PEO602,PEO700,OVR100,FOC100,NPM100,ENC100,BOD100,BOD200,TST100,TST200,TST300
