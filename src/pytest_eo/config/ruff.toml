# Locked configuration: projects cannot override it (only paths/excludes via [tool.eo]).
target-version = "py311"
line-length = 80

[lint]
preview = true
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",         # conflicts with blank-line-before-class
    "multi-line-summary-second-line",            # conflicts with multi-line-summary-first-line
    "missing-trailing-comma",                    # conflicts with the formatter
    "single-line-implicit-string-concatenation", # conflicts with the formatter
    "missing-copyright-notice",                  # needs an author and a license: enable once the project picks them
    "DOC",                                       # docstrings explain purpose, not returns and raises
]

# Codes checked by flake8: lets ruff accept them in "# noqa" comments.
external = ["FIN", "PEO", "OVR", "FOC", "TST", "ENC"]

[lint.per-file-ignores]
"tests/**" = [
    "magic-value-comparison", # literals in expectations are fine
    "D",                      # test names are the documentation
]

[lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "No mocks: write a Fake that implements the same interface."
"mock".msg = "No mocks: write a Fake that implements the same interface."
"pytest_mock".msg = "No mocks: write a Fake that implements the same interface."

[lint.pylint]
max-args = 4
max-statements = 10
max-branches = 4
max-returns = 2
max-nested-blocks = 2
max-public-methods = 5

[lint.mccabe]
max-complexity = 5

[lint.flake8-tidy-imports]
ban-relative-imports = "all"
